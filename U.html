<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>PaO Digital</title>

</head>

<body>

    <div id="root">
        Loading...
    </div>


    <script>

        async function loadPage() {

            const response =
                await fetch("/api/page");

            const data =
                await response.json();

            const root =
                document.getElementById("root");


            root.innerHTML = `

                <h1>
                    ${data.title}
                </h1>

                <p>
                    ${data.description}
                </p>

            `;
        }


        loadPage();

    </script>

</body>

</html>
